# SonarQube Cloud — Peitho (private, free tier < 50k LOC; we are ~11.3k).
# ANALYSIS METHOD: CI-based (.github/workflows/ci.yml → SonarSource/sonarqube-scan-action). This file IS
# honoured under CI-based analysis — unlike Automatic Analysis, which ignores it. Automatic Analysis MUST be
# turned OFF (project → Administration → Analysis Method) or the two conflict and the scan fails.
#
# analyse the RIGOROUS pinned core only (src + tests). CI-based analysis requires these set explicitly.
sonar.projectKey=rohanvinaik_Peitho
sonar.organization=rohanvinaik

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# never analyse data (gitignored anyway) or the generated lockfile (uv.lock is full of legitimate package
# SHA256s that Sonar's secret-detector would false-positive on)
sonar.exclusions=**/data/**,uv.lock
# the Detective harness fixtures are TEST code, so they need sonar.test.exclusions — sonar.exclusions covers
# only MAIN sources and does NOT exclude test files (they kept feeding S8714/S9073 while listed above). They
# still contribute to src/ coverage via pytest, which this exclusion does not affect.
sonar.test.exclusions=tests/detective/**

# coverage: the CI job writes Cobertura coverage.xml (pytest-cov). Coverage-on-new-code is the Quality
# Gate metric; the decision core is mutation-pinned (~100%) and the I/O shell (export_*/load_*/report) is
# integration-pinned over synthetic fixtures → ~87% overall. The residual is the report()/__main__ CLI
# print paths + config ROOT-autodetect: genuine entry points, print-only, legitimately not unit-covered.
sonar.python.coverage.reportPaths=coverage.xml

# --- false-positive suppressions (CI-based analysis honours sonar.issue.ignore; documented, not blanket) ---
# S8707 (pythonsecurity taint — "path from user-controlled data"): Peitho is a LOCAL batch data tool with NO
# request surface. Every file path is composed from the internal config root (peitho.config.ROOT) + dated
# snapshot names, never web/network/user input — path injection is structurally impossible here. The taint
# sensor cannot see that closed world; the finding is a false positive on the local-only I/O shells.
# S9073 (test-shape heuristic): it fires on every hand-authored intent/characterization test — but the pinning
# IS the point of those tests; grading them by a production-test rule is noise, not signal. Scoped to tests/.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=src/peitho/**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.py
# S5843 (regex too complex): the placeholder/walk-in name matcher in customer.py is a deliberate, behavior-
# PINNED junk-name pattern (cash/generic/CUSTOMER/n.a./digits); at complexity 21 it is ONE over the arbitrary
# 20 cap, and any simplification risks changing what it matches. A threshold disagreement on a tested pattern.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e3.resourceKey=src/peitho/customer.py
