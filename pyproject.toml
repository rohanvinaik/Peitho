[project]
name = "peitho"
version = "0.0.1"
description = "A deterministic, dependency-free decision engine over per-location inventory and sales data."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Rohan Vinaik", email = "rohanpvinaik@gmail.com" }]

# Zero runtime dependencies — the decision path is pure Python standard library. Optional delivery
# integrations, if any, are added per deployment, never vendored into the core.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pre-commit>=3.7", "pyyaml>=6", "pylint>=3"]

[tool.uv]
package = false   # scaffold, not a distributable package (yet)

[tool.ruff]
line-length = 120   # this codebase deliberately favours rich, explanatory docstrings
target-version = "py312"
src = ["src"]
# tests/detective : Detective-generated synth suites (machine-authored, regenerated) — skip entirely.
extend-exclude = ["tests/detective"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# pylint runs as a pre-commit SONAR APPROXIMATION over the core (src/) — catches what SonarCloud would flag
# before a push, not pylint's own opinions. So: 200-char lines (SonarPython S103 default, NOT pylint's 100),
# and the pylint-only rules SonarCloud does not share are disabled. Sonar-overlapping smells stay ON.
[tool.pylint.format]
max-line-length = 200

[tool.pylint."messages control"]
disable = [
    "C0114", "C0115", "C0116", # missing docstrings — present where they matter; not a Sonar quality-gate condition
    "C0103", # invalid-name — deliberate short math/domain names (nrv, cogs, dt); ruff owns our naming
    "W1514", # unspecified-encoding — not a SonarPython default rule; the runtime is UTF-8 everywhere
    "R0801", # duplicate-code — Sonar measures duplication density its own way, not by pylint line-matching
    "R0902", "R0903", "R0911", "R0913", "R0914", "R0917", # too-many-* : pylint's limits are far stricter than
    # Sonar's; the flagged functions are intentional record-BUILDERS / the identity resolver (args = fields)
    "W0621", # redefined-outer-name — the module-level CLI `lang`/`at` shadow pattern; benign
    "C0415", # import-outside-toplevel — DELIBERATE: local imports in export.py avoid circular deps + lazy-load lenses
]

[tool.pytest.ini_options]
markers = ["detective: test generated by Detective"]
pythonpath = ["src"]
# mutmut's working copy (gitignored) holds trampolined source + a tests/ copy; never collect it
norecursedirs = ["mutants"]

[tool.mutmut]
# Mutation score is a BEHAVIOURAL metric — "would a test catch a corrupted version of this line?" — so it
# belongs on the decision logic, NOT the I/O interchange shell (open/loop/json.dump), where a mutated
# `open()` or format string is noise, not a real gap. Scope it to the pinned decision surface; exclude the
# export I/O layer. (The pure builders inside export.py are already Detective-pinned + integration-tested.)
source_paths = ["src/peitho"]
do_not_mutate = ["src/peitho/export.py"]

[tool.coverage.run]
# relative_files so the Cobertura paths (src/peitho/…) resolve in CI and Sonar; branch coverage on
# so a mutation-pinned decision's every arm counts. Measure the package only, not the tests themselves.
relative_files = true
branch = true
source = ["src/peitho"]

[tool.coverage.report]
# the integration shell is exercised through the real report pipeline, never unit-tested — same standard
# as scripts/. Marked at the call site with `# pragma: no cover` + a reason, never blanket-omitted here.
show_missing = true
exclude_also = [
    # `if __name__ == "__main__": report()` — CLI entry guards, never executed under pytest (module import,
    # not run-as-main). The report() bodies themselves ARE smoke-tested; only the guard line is excluded.
    'if __name__ == .__main__.:',
]
